name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.20.2"
            otp: "29.0.3"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps and _build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Restore PLT cache
        uses: actions/cache@v4
        id: plt_cache
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Build PLTs
        if: steps.plt_cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Dialyzer
        run: mix dialyzer

      - name: Test
        run: mix test

  # Runs each example's own documented gate independently, in its own directory, with
  # its own deps/_build cache. Each example under examples/ is a fully separate Mix
  # project with its own mix.exs, mix.lock and deps. Every example's gate is the same
  # four commands, run in this order from within that example's own directory:
  #   mix deps.get && mix format --check-formatted && mix compile --warnings-as-errors && mix test
  #
  # This job compiles the `test` env, this workflow's MIX_ENV and the same env the root
  # `test` job above checks. `dev` and `prod` are left unchecked here for CI cost: each
  # additional env means another from-scratch compile of an example's whole dependency
  # tree, which is the dominant cost on this leg.
  examples:
    name: "example (${{ matrix.example }})"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: examples/${{ matrix.example }}

    strategy:
      fail-fast: false
      matrix:
        example:
          - 01_exported_vs_internal
          - 02_phoenix_liveview
        # Same Elixir/OTP pin as the root `test` job above, for consistency across the
        # whole repo's CI. Each example is its own Mix project, so this is a separate
        # setup-beam install per matrix leg, not a shared toolchain.
        elixir: ["1.20.2"]
        otp: ["29.0.3"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # examples/02_phoenix_liveview/mix.exs depends on :lazy_html (only :test), which
      # Phoenix.LiveViewTest uses to parse rendered HTML and which compiles a native
      # library. Its own README flags the requirement. Every other example is pure
      # Elixir over Ash.DataLayer.Ets and needs nothing extra here.
      - name: Install C toolchain for :lazy_html (Phoenix example only)
        if: matrix.example == '02_phoenix_liveview'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Restore deps and _build cache
        uses: actions/cache@v4
        with:
          path: |
            examples/${{ matrix.example }}/deps
            examples/${{ matrix.example }}/_build
          # Keyed per example (the matrix value is part of the key itself), so no
          # example shares a cache entry with the root project's job above or with any
          # other example — each is a fully separate Mix project with its own
          # mix.lock.
          key: mix-example-${{ matrix.example }}-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles(format('examples/{0}/mix.lock', matrix.example)) }}
          restore-keys: |
            mix-example-${{ matrix.example }}-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test
        timeout-minutes: 20
